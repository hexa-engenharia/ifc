<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Visualizador IFC</title>
<style>
  :root {
    --bg: #eef0f3; --card: #ffffffee; --txt: #1d2127; --sub: #5d6672; --linha: #d9dde3;
    --acento: #c4161c; --acento-txt: #fff; --sombra: 0 4px 18px rgba(20, 28, 40, .14);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--txt);
    font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  header { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 10px;
    padding: calc(env(safe-area-inset-top) + 8px) 14px 8px; background: var(--card); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--linha); z-index: 5; }
  #logo { display: flex; flex: none; }
  .tit { min-width: 0; flex: 1; }
  #titulo { font-weight: 650; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { font-size: 12px; color: var(--sub); display: flex; gap: 8px; }
  #painel { position: fixed; left: 12px; bottom: calc(env(safe-area-inset-bottom) + 12px); z-index: 4;
    background: var(--card); backdrop-filter: blur(8px); border: 1px solid var(--linha); border-radius: 14px;
    box-shadow: var(--sombra); width: min(300px, calc(100vw - 24px)); }
  #painel .topo { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px 6px; }
  #painel .topo b { font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--sub); }
  #btnPainel { border: 0; background: none; font-size: 18px; color: var(--sub); padding: 2px 6px; cursor: pointer; }
  #painel.fechado #corpo { display: none; }
  #painel.fechado #btnPainel { transform: rotate(180deg); }
  #disciplinas { list-style: none; margin: 0; padding: 0 6px; max-height: 38vh; overflow: auto; }
  #disciplinas li { display: flex; align-items: center; gap: 6px; padding: 2px 6px; border-radius: 8px; }
  #disciplinas label { flex: 1; display: flex; align-items: center; gap: 9px; padding: 8px 0; cursor: pointer; min-width: 0; }
  #disciplinas input { width: 18px; height: 18px; accent-color: var(--acento); margin: 0; flex: none; }
  .sw { width: 12px; height: 12px; border-radius: 3px; flex: none; }
  .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 550; }
  .so { border: 1px solid var(--linha); background: #fff; border-radius: 7px; font-size: 12px; padding: 4px 8px; color: var(--sub); cursor: pointer; }
  .acoes { display: flex; gap: 6px; padding: 8px 12px 12px; flex-wrap: wrap; }
  .acoes button, .bt { border: 1px solid var(--linha); background: #fff; color: var(--txt); border-radius: 9px;
    padding: 8px 11px; font: inherit; font-size: 13px; cursor: pointer; }
  .acoes button.ativo { background: var(--acento); color: var(--acento-txt); border-color: var(--acento); }
  #info { position: fixed; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 12px); z-index: 4; max-width: min(340px, calc(100vw - 24px));
    background: var(--card); backdrop-filter: blur(8px); border: 1px solid var(--linha); border-radius: 14px; box-shadow: var(--sombra); padding: 12px 40px 12px 14px; }
  #info .t { font-weight: 650; word-break: break-word; }
  #info .s, #info .o { font-size: 12.5px; color: var(--sub); margin-top: 2px; word-break: break-word; }
  #info .x { position: absolute; top: 6px; right: 6px; border: 0; background: none; font-size: 20px; color: var(--sub); cursor: pointer; padding: 4px 8px; }
  @media (max-width: 640px) { #info { left: 12px; right: 12px; max-width: none; bottom: auto; top: calc(env(safe-area-inset-top) + 66px); } }
  #overlay { position: fixed; inset: 0; display: grid; place-items: center; z-index: 10; background: var(--bg); padding: 24px; }
  #overlay[hidden], #boasvindas[hidden], #painel[hidden], #info[hidden] { display: none; }
  .carga { width: min(360px, 100%); text-align: center; }
  #status { color: var(--sub); margin-bottom: 12px; min-height: 2.6em; }
  .trilho { height: 6px; background: #dfe3e8; border-radius: 6px; overflow: hidden; }
  #barra { height: 100%; width: 0; background: var(--acento); transition: width .2s; }
  #barra.indet { width: 35%; animation: vai 1.1s ease-in-out infinite; }
  @keyframes vai { 0% { transform: translateX(-100%); } 100% { transform: translateX(290%); } }
  #overlay.erro #status { color: var(--acento); font-weight: 600; }
  #boasvindas { position: fixed; inset: 0; display: grid; place-items: center; z-index: 6; padding: 24px; }
  #boasvindas .card { background: #fff; border: 1px solid var(--linha); border-radius: 16px; box-shadow: var(--sombra); padding: 22px; max-width: 380px; text-align: center; }
  #boasvindas h1 { font-size: 18px; margin: 0 0 6px; }
  #boasvindas p { color: var(--sub); margin: 0 0 16px; }
  .arquivo { display: inline-block; background: var(--acento); color: #fff; border-radius: 10px; padding: 10px 16px; cursor: pointer; font-weight: 600; }
  .arquivo input { display: none; }
</style>
<script src="config.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<header>
  <span id="logo"></span>
  <div class="tit"><div id="titulo">Visualizador IFC</div><div class="sub"><span id="empresa"></span><span id="data"></span></div></div>
</header>

<div id="painel" hidden>
  <div class="topo"><b>Disciplinas</b><button id="btnPainel" aria-label="Recolher">▾</button></div>
  <div id="corpo">
    <ul id="disciplinas"></ul>
    <div class="acoes">
      <button id="btnEnq">Enquadrar</button>
      <button id="btnTudo">Mostrar tudo</button>
      <button id="btnCor">Cor por disciplina</button>
    </div>
  </div>
</div>

<div id="info" hidden><button class="x" aria-label="Fechar">×</button><div class="t"></div><div class="s"></div><div class="o"></div></div>

<div id="overlay"><div class="carga"><div id="status">Carregando…</div><div class="trilho"><div id="barra" class="indet"></div></div></div></div>

<div id="boasvindas" hidden><div class="card">
  <h1>Visualizador IFC</h1>
  <p>Abra pelo QR code da prancha ou escolha um arquivo .ifc / .ifczip deste aparelho.</p>
  <label class="arquivo">Abrir arquivo<input id="arquivo" type="file" accept=".ifc,.ifczip,.zip"></label>
</div></div>

<script type="module" src="app.js"></script>
</body>
</html>
